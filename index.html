<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Pizzeria Imperial</title>

    <!-- Archivos comentados para habilitar después -->
    <!-- <link rel="manifest" href="manifest.json"> -->
    <!-- <link rel="icon" href="icons/icon.svg"> -->

    <!-- Estilos -->
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Leaflet comentado -->
    <!-- <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" /> -->
</head>


<body>

    <!-- App Shell: Encabezado -->
    <header class="app-header">
        <!-- Reemplaza src con tu logo si tienes, o deja el texto -->
        <img src="img/logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>Pizzeria Imperial</h1>
    </header>

    <!-- App Shell: Zona del catálogo -->
    <main id="zona-catalogo">
        <!-- csr.js inyectará los productos aquí -->
    </main>
    <!-- App Shell: Carrito (carrito.js lo llena con lo guardado en localStorage) -->
    <!-- App Shell: Carrito (carrito.js lo llena con lo guardado en localStorage) -->
    <section id="carrito" class="card" style="max-width: 900px; margin: 2rem auto; padding: 1rem;">
        <h2>Tu pedido</h2>
        <div id="lista-carrito"></div>
        <p><strong>Total: <span id="total-carrito">$0</span></strong></p>
        <button id="btn-sincronizar" type="button">Sincronizar carrito</button>
        <p id="carrito-mensaje"></p>
    </section>

    <!-- App Shell: Notificaciones -->
    <section id="notificaciones" class="card" style="max-width: 900px; margin: 2rem auto; padding: 1rem;">
        <h2>Notificaciones de ofertas</h2>
        <button id="btn-notificar" type="button">Activar notificaciones</button>
        <p id="notificaciones-mensaje"></p>
    </section>


    <!-- App Shell: Pie de página -->
    <footer class="app-footer">
        <p>&copy; 2026 Pizzeria Imperial. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts comentados para habilitar después -->
    <script src="js/carrito.js"></script>
    <script src="js/csr.js"></script>
    <script src="js/notificaciones.js"></script>
    <!-- <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script> -->
    <!-- <script src="js/geolocalizacion.js"></script> -->
    <!-- <script src="js/app.js"></script> -->






    <!-- Registro de Service Worker comentado -->
    <!--

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script> 
    -->
</body>

</html>
