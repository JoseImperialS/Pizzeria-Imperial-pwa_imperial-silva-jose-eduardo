<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Pizzeria Imperial</title>
    <meta name="description"
        content="Pizzería Imperial: catálogo de pizzas y bebidas, carrito de compras y ubicación de la sucursal, disponible incluso sin conexión.">

    <!-- PWA: manifest, color del tema e ícono -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b71c1c">
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/estilos.css">

    <!-- Leaflet: librería de mapas gratuita (sin API key) para dibujar la ruta a la sucursal -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>

<body>

    <!-- ============ APP SHELL ============
         Esqueleto que siempre se ve igual; el Service Worker lo cachea completo.
         Solo los datos de adentro cambian (los llena JavaScript). -->

    <header class="app-header">
        <img src="img/logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>Pizzeria Imperial</h1>
        <!-- app.js actualiza este span: conectado / sin conexión -->
        <span id="estado-conexion" class="pill">conectado</span>
    </header>

    <main>
        <!-- Catálogo (CSR): csr.js lo llena DESPUÉS de que la página cargó -->
        <section>
            <h2>Catálogo</h2>
            <div id="catalogo" class="grid" aria-busy="true" aria-label="Cargando catálogo"></div>
        </section>

        <!-- Carrito -->
        <section>
            <h2>Carrito</h2>
            <ul id="carrito-lista"></ul>
            <p>Total: $<span id="carrito-total">0</span></p>
            <button id="btn-sincronizar" type="button">Sincronizar carrito</button>
            <p id="carrito-mensaje" class="mensaje"></p>
        </section>

        <!-- Notificaciones -->
        <section>
            <h2>Notificaciones de ofertas</h2>
            <button id="btn-notificar" type="button">Activar notificaciones</button>
            <p id="notificaciones-mensaje" class="mensaje"></p>
        </section>

        <!-- Ubicación (característica del dispositivo) -->
        <section>
            <h2>Distancia a la sucursal</h2>
            <p class="sucursal-info">Sucursal: <strong>Universidad Tecnológica de Hermosillo (UTH)</strong>, Hermosillo,
                Sonora.</p>
            <button id="btn-ubicacion" type="button">Usar mi ubicación</button>
            <p id="ubicacion-mensaje" class="mensaje"></p>
            <!-- Empieza oculto: geolocalizacion.js le quita "hidden" y lo llena de mapa -->
            <div id="mapa-ruta" class="mapa" hidden></div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Pizzeria Imperial. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts al final del <body>: el HTML ya existe cuando el JS busca los elementos.
         Orden importante: carrito.js antes que csr.js, y Leaflet antes que geolocalizacion.js -->
    <script src="js/carrito.js"></script>
    <script src="js/csr.js"></script>
    <script src="js/notificaciones.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/geolocalizacion.js"></script>
    <script src="js/app.js"></script>

    <!-- Registro del Service Worker generado con Workbox (una sola línea, sin esperar a "load") -->
    <script>
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    </script>
</body>

</html>
